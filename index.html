<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OBSCURA</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* resolução interna fixa (1200x680); CSS escala mantendo proporção,
     preparando a exibição em telas menores/celular */
  canvas {
    background: #000; cursor: none;
    max-width: 100vw; max-height: 100vh;
    max-width: 100dvw; max-height: 100dvh;  /* considera a barra do navegador móvel */
    width: auto; height: auto;
    aspect-ratio: 1200 / 680;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1200" height="680"></canvas>
<script>
"use strict";

// ==================================================================
// CONFIG
// ==================================================================
const CELL = 10;
const COLS = 120, ROWS = 68;
const RAMP = " .:-=+*#%@";

const LANTERNA = { halfAngle: 0.42, range: 34, rays: 180, power: 1.0 };
const FLASH    = { halfAngle: 0.85, range: 58, rays: 320, power: 2.6,
                   duration: 1.0, cooldown: 1.6 };

const PLAYER_SPEED  = 10;      // reduzido (era 14)
const PLAYER_RADIUS = 0.42;

const FILM_START = 6, FILM_MAX = 12, FILM_REFILL = 3;
const ALBUM_MAX  = 24;

// ==================================================================
// RNG com seed (procedural, determinístico)
// ==================================================================
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);

function hash(x, y, t) {
  let n = x * 374761393 + y * 668265263 + t * 2246822519;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

// ==================================================================
// ESTADO GLOBAL
// ==================================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let state = "intro";     // intro | play | album | dead | transition
let level = 1;
let seed  = (Date.now() % 1e9) | 0;

const grid  = new Uint8Array(COLS * ROWS);
const light = new Float32Array(COLS * ROWS);

const player = { x: 20, y: 16 };
const mouse  = { x: 600, y: 340 };
const cam    = { x: 600, y: 340 };         // câmera (só dá zoom no celular)
let camZoom  = 1;
const keys   = new Set();

let rooms = [], anomalies = [], filmPickups = [], ghosts = [], particles = [];
let exitP = { x: 0, y: 0, active: false };

let film = FILM_START, sanity = 100;
let flashT = 0, flashDir = 0, flashCd = 0;
let attractT = 0;            // fantasmas atraídos pelo flash
let shake = 0, flickDip = 0;
let announceT = 0, announceText = "";
let eventT = 12;             // próximo evento de tensão
let hbT = 0;                 // heartbeat
let dmgSfxT = 0;
let transT = 0;

let album = [], albumIdx = 0, photoCount = 0;
let albumReturn = "play";   // para onde o álbum volta ao fechar (play ou dead)

let time = 0, last = performance.now();

// ==================================================================
// MAPA PROCEDURAL: salas aleatórias + corredores em L
// ==================================================================
function carve(x, y, w, h) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i > 0 && j > 0 && i < COLS - 1 && j < ROWS - 1) grid[j * COLS + i] = 0;
}
function isWall(cx, cy) {
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return true;
  return grid[cy * COLS + cx] === 1;
}
function roomCenter(r) { return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }

function overlaps(a, b, m) {
  return a.x - m < b.x + b.w && a.x + a.w + m > b.x &&
         a.y - m < b.y + b.h && a.y + a.h + m > b.y;
}

function corridorH(x1, x2, y) { carve(Math.min(x1, x2) - 1, y - 1, Math.abs(x2 - x1) + 3, 3); }
function corridorV(y1, y2, x) { carve(x - 1, Math.min(y1, y2) - 1, 3, Math.abs(y2 - y1) + 3); }
function connect(a, b) {
  const ca = roomCenter(a), cb = roomCenter(b);
  const ax = ca.x | 0, ay = ca.y | 0, bx = cb.x | 0, by = cb.y | 0;
  if (rng() < 0.5) { corridorH(ax, bx, ay); corridorV(ay, by, bx); }
  else             { corridorV(ay, by, ax); corridorH(ax, bx, by); }
}

function randInRoom(r, margin) {
  const m = margin || 2;
  return {
    x: r.x + m + rng() * (r.w - m * 2),
    y: r.y + m + rng() * (r.h - m * 2),
  };
}

function genLevel() {
  rng = mulberry32(seed + level * 7919);
  grid.fill(1);
  rooms = []; anomalies = []; filmPickups = []; ghosts = []; particles = [];

  // --- salas ---
  const target = 7 + Math.min(level, 4);
  for (let tries = 0; tries < 120 && rooms.length < target; tries++) {
    const w = 10 + (rng() * 14 | 0), h = 7 + (rng() * 8 | 0);
    const x = 2 + (rng() * (COLS - w - 4) | 0);
    const y = 2 + (rng() * (ROWS - h - 4) | 0);
    const r = { x, y, w, h };
    if (rooms.some(o => overlaps(r, o, 3))) continue;
    carve(x, y, w, h);
    rooms.push(r);
  }

  // --- corredores: cadeia + 2 atalhos (loops) ---
  for (let i = 1; i < rooms.length; i++) connect(rooms[i - 1], rooms[i]);
  for (let i = 0; i < 2 && rooms.length > 3; i++)
    connect(rooms[rng() * rooms.length | 0], rooms[rng() * rooms.length | 0]);

  // --- jogador na sala 0 ---
  const start = roomCenter(rooms[0]);
  player.x = start.x; player.y = start.y;

  // --- saída na sala mais distante ---
  let far = 1, fd = -1;
  for (let i = 1; i < rooms.length; i++) {
    const c = roomCenter(rooms[i]);
    const d = Math.hypot(c.x - start.x, c.y - start.y);
    if (d > fd) { fd = d; far = i; }
  }
  const ec = roomCenter(rooms[far]);
  exitP = { x: ec.x, y: ec.y, active: false };

  // --- anomalias (3) em salas distintas, nem inicial nem da saída ---
  const pool = rooms.map((_, i) => i).filter(i => i !== 0 && i !== far);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = rng() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const nAnom = 3;
  for (let i = 0; i < nAnom; i++) {
    const r = rooms[pool[i % pool.length]];
    const p = randInRoom(r);
    anomalies.push({ x: p.x, y: p.y, captured: false });
  }

  // --- refis de filme: cada vez mais raros (some a partir da noite 7) ---
  const nFilm = Math.max(0, 4 - Math.ceil(level / 2));
  for (let i = 0; i < nFilm; i++) {
    const r = rooms[1 + (rng() * (rooms.length - 1) | 0)];
    const p = randInRoom(r);
    filmPickups.push({ x: p.x, y: p.y });
  }

  // --- fantasmas em salas longe do jogador ---
  const nGhost = Math.min(4 + level, 9);
  for (let i = 0; i < nGhost; i++) ghosts.push(spawnGhost());

  flashT = 0; flashCd = 0; attractT = 0; eventT = 10 + rng() * 15;
  cam.x = player.x * CELL; cam.y = player.y * CELL;   // câmera já nasce no jogador
}

function spawnGhost() {
  for (let t = 0; t < 40; t++) {
    const r = rooms[1 + (rng() * (rooms.length - 1) | 0)];
    const p = randInRoom(r);
    if (Math.hypot(p.x - player.x, p.y - player.y) > 28)
      return { x: p.x, y: p.y, wx: p.x, wy: p.y, chase: false,
               respawn: 0, bob: rng() * 6.28, artSeed: rng(), sprCv: null };
  }
  const r = rooms[rooms.length - 1], p = randInRoom(r);
  return { x: p.x, y: p.y, wx: p.x, wy: p.y, chase: false, respawn: 0, bob: 0,
           artSeed: rng(), sprCv: null };
}

// ==================================================================
// LINHA DE VISÃO (DDA simples célula a célula)
// ==================================================================
function hasLOS(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  const steps = Math.ceil(d * 2);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isWall((x0 + (x1 - x0) * t) | 0, (y0 + (y1 - y0) * t) | 0)) return false;
  }
  return true;
}

// ==================================================================
// LUZ (top-down)
// ==================================================================
function castLight(px, py, dir, halfAngle, range, power, rays) {
  const step = 0.5;
  for (let i = 0; i < rays; i++) {
    const rel = rays > 1 ? (i / (rays - 1)) * 2 - 1 : 0;
    const a = dir + rel * halfAngle;
    const angFall = 1 - rel * rel;
    const dx = Math.cos(a), dy = Math.sin(a);
    for (let d = 0; d < range; d += step) {
      const cx = (px + dx * d) | 0, cy = (py + dy * d) | 0;
      if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) break;
      const distFall = Math.pow(1 - d / range, 1.6);
      const v = power * angFall * distFall;
      const idx = cy * COLS + cx;
      if (v > light[idx]) light[idx] = v;
      if (grid[idx] === 1) break;
    }
  }
}

function addGlow(gx, gy, r, p) {
  const x0 = Math.max(0, (gx - r) | 0), x1 = Math.min(COLS - 1, (gx + r) | 0);
  const y0 = Math.max(0, (gy - r) | 0), y1 = Math.min(ROWS - 1, (gy + r) | 0);
  for (let cy = y0; cy <= y1; cy++)
    for (let cx = x0; cx <= x1; cx++) {
      const d = Math.hypot(cx + 0.5 - gx, cy + 0.5 - gy);
      if (d > r) continue;
      const v = p * (1 - d / r);
      const idx = cy * COLS + cx;
      if (v > light[idx]) light[idx] = v;
    }
}

function lightAt(x, y) {
  const cx = x | 0, cy = y | 0;
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return 0;
  return light[cy * COLS + cx];
}

// ==================================================================
// ÁUDIO (100% sintetizado, sem assets)
// ==================================================================
let AC = null, master = null;

function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55;
    master.connect(AC.destination);

    // drone grave contínuo
    const g = AC.createGain(); g.gain.value = 0.05;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180;
    const o1 = AC.createOscillator(); o1.type = "triangle"; o1.frequency.value = 48;
    const o2 = AC.createOscillator(); o2.type = "sine";     o2.frequency.value = 48.7;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);
    // respiração lenta do drone
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = AC.createGain(); lfoG.gain.value = 0.03;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    o1.start(); o2.start(); lfo.start();
  } catch (e) { /* sem áudio, segue o jogo */ }
}

function noiseBuf(sec) {
  const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function envGain(v0, t1) {
  const g = AC.createGain();
  g.gain.setValueAtTime(v0, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t1);
  g.connect(master);
  return g;
}
function sfxCamera() {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = "square"; o.frequency.value = 900;
  o.connect(envGain(0.12, 0.05)); o.start(); o.stop(AC.currentTime + 0.05);
  const n = AC.createBufferSource(); n.buffer = noiseBuf(0.25);
  const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 2000;
  n.connect(f); f.connect(envGain(0.2, 0.25)); n.start();
}
function sfxDry() {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = "square"; o.frequency.value = 300;
  o.connect(envGain(0.06, 0.04)); o.start(); o.stop(AC.currentTime + 0.04);
}
function sfxPickup() {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(500, AC.currentTime);
  o.frequency.linearRampToValueAtTime(760, AC.currentTime + 0.12);
  o.connect(envGain(0.12, 0.18)); o.start(); o.stop(AC.currentTime + 0.18);
}
function sfxDissolve() {
  if (!AC) return;
  const n = AC.createBufferSource(); n.buffer = noiseBuf(0.6);
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
  f.frequency.setValueAtTime(2200, AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(120, AC.currentTime + 0.55);
  n.connect(f); f.connect(envGain(0.25, 0.6)); n.start();
}
function sfxSting() {
  if (!AC) return;
  [55, 58.3, 82.4].forEach(fr => {
    const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr;
    const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
    o.connect(lp); lp.connect(envGain(0.09, 1.2));
    o.start(); o.stop(AC.currentTime + 1.2);
  });
}
function sfxHeart(vol) {
  if (!AC) return;
  for (const dt of [0, 0.14]) {
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = 55;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, AC.currentTime + dt);
    g.gain.linearRampToValueAtTime(vol, AC.currentTime + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dt + 0.12);
    o.connect(g); g.connect(master);
    o.start(AC.currentTime + dt); o.stop(AC.currentTime + dt + 0.15);
  }
}
function sfxWhisper() {
  if (!AC) return;
  const n = AC.createBufferSource(); n.buffer = noiseBuf(1.0);
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.5;
  f.frequency.setValueAtTime(500 + Math.random() * 600, AC.currentTime);
  f.frequency.linearRampToValueAtTime(300, AC.currentTime + 1.0);
  n.connect(f); f.connect(envGain(0.07, 1.0)); n.start();
}
function sfxDamage() {
  if (!AC) return;
  const n = AC.createBufferSource(); n.buffer = noiseBuf(0.3);
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 400;
  n.connect(f); f.connect(envGain(0.3, 0.3)); n.start();
}
function sfxDeath() {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(200, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(30, AC.currentTime + 2);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
  o.connect(lp); lp.connect(envGain(0.25, 2)); o.start(); o.stop(AC.currentTime + 2);
}

// ==================================================================
// ENTRADA
// ==================================================================
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))
    e.preventDefault();

  if (state === "intro") {
    if (e.code === "Enter" || e.code === "Space") startGame();
    return;
  }
  if (state === "dead") {
    if (e.code === "Enter") { retry(); return; }
    if (e.code === "KeyF") {                       // rever as fotos da run
      state = "album"; albumReturn = "dead";
      albumIdx = Math.max(0, album.length - 1);
    }
    return;
  }

  if (e.code === "KeyF") {
    if (state === "play") {
      state = "album"; albumReturn = "play";
      albumIdx = Math.max(0, album.length - 1);
    } else if (state === "album") state = albumReturn;
    return;
  }
  if (state === "album") {
    if (e.code === "Escape") state = albumReturn;
    if (e.code === "ArrowLeft"  && albumIdx > 0) albumIdx--;
    if (e.code === "ArrowRight" && albumIdx < album.length - 1) albumIdx++;
    return;
  }
  keys.add(e.code);
});
window.addEventListener("keyup", e => keys.delete(e.code));

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
  mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
  aimSource = "mouse";
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", e => {
  if (state === "intro") {
    const rct = canvas.getBoundingClientRect();
    const mx = (e.clientX - rct.left) * (canvas.width / rct.width);
    const my = (e.clientY - rct.top) * (canvas.height / rct.height);
    if (mx >= BTN_START.x && mx <= BTN_START.x + BTN_START.w &&
        my >= BTN_START.y && my <= BTN_START.y + BTN_START.h) startGame();
    return;
  }
  if (state !== "play") return;
  if (e.button === 2) takePhoto();
});

function aimAngle() {
  if (aimSource === "stick") return aimDirStick;
  return Math.atan2(mouse.y - player.y * CELL, mouse.x - player.x * CELL);
}

// ------------------------------------------------------------------
// TOQUE (celular): esquerda = joystick, direita = mirar, botões na tela
// ------------------------------------------------------------------
const IS_TOUCH = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const touchUI = { seen: IS_TOUCH, joyId: null, jx: 0, jy: 0, jkx: 0, jky: 0,
                  aimId: null, akx: 0, aky: 0 };
const MOVE_STICK = { x: 150,  y: 530, r: 90, travel: 56, knob: 30 }; // andar (fixo)
const AIM_STICK  = { x: 1050, y: 530, r: 90, travel: 56, knob: 30 }; // lanterna (fixo)
const BTN_PHOTO  = { x: 1050, y: 360, r: 62 };                       // acima do direcional
const BTN_ALBUM  = { x: 1118, y: 70,  r: 46 };
const BTN_FS     = { x: 1118, y: 182, r: 40 };  // tela cheia (só no touch)
const BTN_START  = { x: 460, y: 565, w: 280, h: 70 };

function updateMoveStick(p) {
  const dx = p.x - MOVE_STICK.x, dy = p.y - MOVE_STICK.y;
  const d = Math.hypot(dx, dy);
  const cl = Math.min(d, MOVE_STICK.travel) / (d || 1);   // knob preso no círculo
  touchUI.jkx = dx * cl; touchUI.jky = dy * cl;
  touchUI.jx = touchUI.jkx / MOVE_STICK.travel;
  touchUI.jy = touchUI.jky / MOVE_STICK.travel;
}

// direção da lanterna: mouse (aponta para o cursor) ou direcional (ângulo fixo)
let aimSource = "mouse", aimDirStick = 0;

function updateAimStick(p) {
  const dx = p.x - AIM_STICK.x, dy = p.y - AIM_STICK.y;
  const d = Math.hypot(dx, dy);
  if (d > 8) { aimDirStick = Math.atan2(dy, dx); aimSource = "stick"; }
  const cl = Math.min(d, AIM_STICK.travel) / (d || 1);   // knob preso no círculo
  touchUI.akx = dx * cl; touchUI.aky = dy * cl;
}

function enterFullscreen() {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().then(() => {
        try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {}
      }).catch(() => {});
  } catch (e) {}
}
function toggleFullscreen() {
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
  else enterFullscreen();
}

function tcoord(t) {
  const rct = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - rct.left) * (canvas.width / rct.width),
    y: (t.clientY - rct.top) * (canvas.height / rct.height),
  };
}

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  touchUI.seen = true;
  for (const t of e.changedTouches) {
    const p = tcoord(t);
    if (state === "intro") {
      if (p.x >= BTN_START.x && p.x <= BTN_START.x + BTN_START.w &&
          p.y >= BTN_START.y && p.y <= BTN_START.y + BTN_START.h) {
        enterFullscreen(); startGame();
      }
      return;
    }
    if (state === "dead") {
      if (Math.abs(p.x - canvas.width / 2) < 130 &&
          p.y > canvas.height / 2 + 92 && p.y < canvas.height / 2 + 148) {
        state = "album"; albumReturn = "dead";
        albumIdx = Math.max(0, album.length - 1);
      } else retry();
      return;
    }
    if (state === "album") {
      if (album.length && p.x > canvas.width * 0.66)
        albumIdx = Math.min(album.length - 1, albumIdx + 1);
      else if (album.length && p.x < canvas.width * 0.33 && albumIdx > 0) albumIdx--;
      else state = albumReturn;
      return;
    }
    if (Math.hypot(p.x - BTN_PHOTO.x, p.y - BTN_PHOTO.y) < BTN_PHOTO.r + 16) {
      takePhoto(); continue;
    }
    if (Math.hypot(p.x - BTN_ALBUM.x, p.y - BTN_ALBUM.y) < BTN_ALBUM.r + 16) {
      state = "album"; albumReturn = "play";
      albumIdx = Math.max(0, album.length - 1); continue;
    }
    if (Math.hypot(p.x - BTN_FS.x, p.y - BTN_FS.y) < BTN_FS.r + 14) {
      toggleFullscreen(); continue;
    }
    if (touchUI.aimId === null &&
        Math.hypot(p.x - AIM_STICK.x, p.y - AIM_STICK.y) < AIM_STICK.r + 40) {
      touchUI.aimId = t.identifier;
      updateAimStick(p);
    } else if (touchUI.joyId === null &&
               Math.hypot(p.x - MOVE_STICK.x, p.y - MOVE_STICK.y) < MOVE_STICK.r + 50) {
      touchUI.joyId = t.identifier;
      updateMoveStick(p);
    }
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = tcoord(t);
    if (t.identifier === touchUI.joyId) {
      updateMoveStick(p);
    } else if (t.identifier === touchUI.aimId) {
      updateAimStick(p);
    }
  }
}, { passive: false });

function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchUI.joyId) {
      touchUI.joyId = null;
      touchUI.jx = 0; touchUI.jy = 0; touchUI.jkx = 0; touchUI.jky = 0;
    }
    if (t.identifier === touchUI.aimId) {           // knob volta ao centro,
      touchUI.aimId = null;                          // lanterna mantém a direção
      touchUI.akx = 0; touchUI.aky = 0;
    }
  }
}
canvas.addEventListener("touchend", touchEnd, { passive: false });
canvas.addEventListener("touchcancel", touchEnd, { passive: false });

function startGame() { initAudio(); genLevel(); state = "play"; }
function retry() {
  sanity = 100; film = FILM_START;
  album = []; albumIdx = 0; photoCount = 0;   // o filme da run anterior se perde
  albumReturn = "play";
  seed = (seed + 1337) | 0;
  genLevel();
  state = "play";
}

// ==================================================================
// FOTO (mecânica + render 3D)
// ==================================================================
function inFlashCone(ex, ey, dir) {
  const dx = ex - player.x, dy = ey - player.y;
  const d = Math.hypot(dx, dy);
  if (d > FLASH.range * 0.85) return false;
  let da = Math.atan2(dy, dx) - dir;
  while (da > Math.PI) da -= 2 * Math.PI;
  while (da < -Math.PI) da += 2 * Math.PI;
  if (Math.abs(da) > FLASH.halfAngle * 0.95) return false;
  return hasLOS(player.x, player.y, ex, ey);
}

function takePhoto() {
  if (flashCd > 0) return;
  if (film <= 0) { sfxDry(); return; }
  film--;
  flashT = 1; flashCd = FLASH.cooldown;
  flashDir = aimAngle();
  attractT = 7;                       // o clarão chama atenção...
  sfxCamera();

  // renderiza a foto ANTES de marcar capturas/dissolver
  // (a anomalia sai viva e vermelha na foto; o fantasma sai inteiro)
  photoCount++;
  const toCapture = anomalies.filter(a => !a.captured && inFlashCone(a.x, a.y, flashDir));

  const cv = renderPhoto(player.x, player.y, flashDir, toCapture.length > 0);
  album.push({ cv, caption: `FOTO ${photoCount} — NOITE ${level}` });
  if (album.length > ALBUM_MAX) album.shift();

  for (const a of toCapture) a.captured = true;
  if (toCapture.length > 0) {
    sfxSting();
    if (anomalies.every(a => a.captured)) {
      exitP.active = true;
      announceText = "A PORTA APARECEU";
      announceT = 5;
    }
  }

  // dissolve fantasmas no cone
  for (const g of ghosts) {
    if (g.respawn > 0) continue;
    if (inFlashCone(g.x, g.y, flashDir)) {
      g.respawn = 10 + rng() * 6;
      g.chase = false;
      sfxDissolve();
      for (let i = 0; i < 26; i++) {
        const a = rng() * 6.28, s = 4 + rng() * 14;
        particles.push({
          x: g.x, y: g.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 0.7, ch: "Ψ*·:"[rng() * 4 | 0],
        });
      }
    }
  }
}

// --- renderizador 3D em ASCII (raycaster estilo Wolfenstein) ---

// Sprites de alta qualidade (fora do estilo ASCII, de propósito):
// o fantasma e a anomalia "furam" a estética do cenário na foto.
// ------------------------------------------------------------------
// FANTASMA — estilo "desenho a caneta" da referência do usuário:
// crânio pálido de hachura densa, olhos = buracos negros com aro
// branco rabiscado, boca pequena e torta, cabelo em fios, mãos
// esqueléticas de dedos compridos. O corpo nunca aparece inteiro:
// a criatura emerge do chão ou atravessa uma "parede invisível".
// ------------------------------------------------------------------
function makeGhostSprite(n) {
  const r = mulberry32((n * 1e9) | 0);
  const v = r();
  if (v < 0.30) return ghostPeek(r);    // réplica da referência: cabeça + mão(s)
  if (v < 0.55) return ghostFloor(r);   // emergindo do chão, mãos fincadas
  if (v < 0.75) return ghostReach(r);   // braço comprido atravessando o nada
  return ghostBody(r);                  // corpo inteiro distorcido, com pernas
}

function penTools(g, r) {
  function pen(x0, y0, x1, y1, alpha, lw) {
    g.strokeStyle = `rgba(226,226,233,${alpha})`;
    g.lineWidth = lw;
    g.beginPath(); g.moveTo(x0, y0);
    g.quadraticCurveTo((x0 + x1) / 2 + (r() - 0.5) * 3,
                       (y0 + y1) / 2 + (r() - 0.5) * 3, x1, y1);
    g.stroke();
  }
  function dark(x0, y0, x1, y1, alpha, lw) {
    g.strokeStyle = `rgba(2,2,4,${alpha})`;
    g.lineWidth = lw;
    g.beginPath(); g.moveTo(x0, y0);
    g.quadraticCurveTo((x0 + x1) / 2 + (r() - 0.5) * 3,
                       (y0 + y1) / 2 + (r() - 0.5) * 3, x1, y1);
    g.stroke();
  }

  // crânio completo, centrado em (cx,cy), raio R, levemente inclinado
  // hairLen: 1 = cabelo longo; menor quando o corpo precisa aparecer
  function skull(cx, cy, R, tilt, hairLen) {
    hairLen = hairLen || 1;
    g.save();
    g.translate(cx, cy);
    g.rotate(tilt);

    // silhueta da cabeça: UMA forma irregular (bolhas redondas viram desenho animado)
    g.fillStyle = "rgba(4,4,6,0.94)";
    const phase = r() * 6.28, phase2 = r() * 6.28;
    g.beginPath();
    const npts = 34;
    for (let i = 0; i <= npts; i++) {
      const a = i / npts * 6.283;
      const wob = 1 + 0.09 * Math.sin(a * 3 + phase) + 0.06 * Math.sin(a * 7 + phase2);
      const x = Math.cos(a) * R * 1.14 * wob;
      const y = Math.sin(a) * R * 1.30 * wob - R * 0.05;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
    // pescoço: curto e fino (comprido demais parecia um colete escuro)
    g.beginPath();
    g.moveTo(-R * 0.20, R * 0.95);
    g.quadraticCurveTo(-R * 0.15, R * 1.1, -R * (0.08 + r() * 0.05), R * 1.3);
    g.lineTo(R * (0.10 + r() * 0.05), R * 1.3);
    g.quadraticCurveTo(R * 0.16, R * 1.1, R * 0.20, R * 0.95);
    g.closePath(); g.fill();
    for (let i = 0; i < 8; i++) {        // riscos no pescoço
      const t = r();
      pen(-R * 0.12 + r() * R * 0.24, R * (1.0 + t * 0.25),
          -R * 0.12 + r() * R * 0.24 + (r() - 0.5) * 4, R * (1.0 + t * 0.25) + 4 + r() * 6,
          0.08 + r() * 0.15, 0.7);
    }

    const eL = { x: -R * 0.42, y: -R * 0.08, rr: R * (0.30 + r() * 0.05) };
    const eR = { x:  R * 0.40, y: -R * 0.10, rr: R * (0.27 + r() * 0.05) };

    // base pálida do rosto (na referência o rosto é claro; os olhos é que são breu)
    const faceRx = R * 1.02, faceRy = R * 1.18;
    const wash = g.createRadialGradient(0, -R * 0.05, R * 0.15, 0, -R * 0.05, R * 1.1);
    wash.addColorStop(0, "rgba(158,158,168,0.62)");
    wash.addColorStop(0.7, "rgba(126,126,138,0.36)");
    wash.addColorStop(1, "rgba(90,90,100,0)");
    g.fillStyle = wash;
    g.beginPath(); g.ellipse(0, -R * 0.05, faceRx, faceRy, 0, 0, 7); g.fill();

    // pele: hachura de caneta por cima, clara no meio, morrendo nas bordas
    for (let i = 0; i < 1100; i++) {
      const a = r() * 6.283, rad = Math.sqrt(r());
      const x = Math.cos(a) * rad * faceRx;
      const y = Math.sin(a) * rad * faceRy - R * 0.05;
      if (Math.hypot(x - eL.x, y - eL.y) < eL.rr * 1.02) continue;  // buracos intactos
      if (Math.hypot(x - eR.x, y - eR.y) < eR.rr * 1.02) continue;
      let b = Math.pow(1 - rad, 0.5) * (0.5 + 0.5 * r());
      if (y > R * 0.8) b *= 0.55;                                   // queixo afunda
      const sa = -1.05 + (r() - 0.5) * 0.5 + (r() < 0.25 ? 1.4 : 0);
      const sl = 2.5 + r() * 4;
      pen(x - Math.cos(sa) * sl, y - Math.sin(sa) * sl,
          x + Math.cos(sa) * sl, y + Math.sin(sa) * sl,
          0.07 + 0.24 * b, 0.6 + r() * 0.5);
    }

    // cabelo: fios que nascem no couro e já CAEM rente ao rosto
    // (nada de velocidade para fora, que formava um halo/bola alto)
    for (let i = 0; i < 240; i++) {
      const a0 = -Math.PI + r() * Math.PI;
      let x = Math.cos(a0) * R * (0.72 + r() * 0.14);
      let y = Math.sin(a0) * R * (0.80 + r() * 0.14) - R * 0.08;
      const wild = r() < 0.12;                       // raros fios rebeldes
      const side = Math.cos(a0) >= 0 ? 1 : -1;       // escorre pelo seu lado
      // nasce quase parado: a gravidade assume na hora e o fio despenca justo
      const overFace = !wild && r() < 0.22;          // uns poucos caem sobre o rosto
      let vx2 = wild ? side * (0.6 + r() * 0.8)
                     : overFace ? (r() - 0.5) * 0.08
                     : side * (0.06 + Math.abs(Math.cos(a0)) * 0.12);
      let vy2 = wild ? 0.15 + r() * 0.3 : 0.08 + r() * 0.08;
      g.strokeStyle = `rgba(215,215,222,${0.05 + r() * 0.2})`;
      g.lineWidth = 0.5 + r() * 0.8;
      g.beginPath(); g.moveTo(x, y);
      const segs = 4 + (r() * 4 | 0);
      for (let s2 = 0; s2 < segs; s2++) {
        vx2 += (r() - 0.5) * 0.45;
        vy2 += 0.85 + (r() - 0.5) * 0.3;
        const il = 1 / Math.hypot(vx2, vy2);
        vx2 *= il; vy2 *= il;
        const len = R * (0.18 + r() * 0.28) * hairLen;
        x += vx2 * len; y += vy2 * len;
        g.lineTo(x, y);
      }
      g.stroke();
    }

    // olhos: vazios absolutos com aros brancos rabiscados
    for (const e of [eL, eR]) {
      const halo = g.createRadialGradient(e.x, e.y, e.rr * 0.4, e.x, e.y, e.rr * 1.5);
      halo.addColorStop(0, "rgba(0,0,0,1)");
      halo.addColorStop(0.75, "rgba(0,0,0,0.85)");
      halo.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = halo;
      g.beginPath(); g.arc(e.x, e.y, e.rr * 1.5, 0, 7); g.fill();
      g.fillStyle = "#000";
      g.beginPath(); g.arc(e.x, e.y, e.rr, 0, 7); g.fill();

      // aros RABISCADOS: muitos arcos parciais irregulares, nunca círculo limpo
      for (let k = 0; k < 14; k++) {
        const rad2 = e.rr * (0.98 + r() * 0.28);
        g.strokeStyle = `rgba(232,232,240,${0.15 + r() * 0.5})`;
        g.lineWidth = 0.6 + r() * 1.0;
        g.beginPath();
        const aa0 = r() * 6.28, arc = 1.2 + r() * 3.5, steps = 14;
        for (let i2 = 0; i2 <= steps; i2++) {
          const a = aa0 + i2 / steps * arc;
          const rj = rad2 * (1 + (r() - 0.5) * 0.16);
          const x = e.x + Math.cos(a) * rj, y = e.y + Math.sin(a) * rj;
          i2 ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
      for (let k = 0; k < 40; k++) {
        const a = r() * 6.283;
        const r0 = e.rr * (1.0 + r() * 0.15), r1 = r0 + 2 + r() * 6;
        pen(e.x + Math.cos(a) * r0, e.y + Math.sin(a) * r0,
            e.x + Math.cos(a) * r1, e.y + Math.sin(a) * r1,
            0.12 + r() * 0.3, 0.6);
      }
      // sombra rabiscada afundando a órbita
      for (let k = 0; k < 18; k++) {
        const a = r() * 6.283;
        const r0 = e.rr * (1.3 + r() * 0.3);
        dark(e.x + Math.cos(a) * r0, e.y + Math.sin(a) * r0,
             e.x + Math.cos(a) * (r0 + 4 + r() * 4), e.y + Math.sin(a) * (r0 + 4),
             0.3, 1.2);
      }
    }

    // nariz: quase nada — sombra e duas narinas mínimas
    dark(0, R * 0.28, (r() - 0.5) * 3, R * 0.45, 0.5, 2.5);
    g.fillStyle = "rgba(0,0,0,0.75)";
    g.beginPath(); g.ellipse(-R * 0.07, R * 0.44, 2.2, 1.6, 0.3, 0, 7); g.fill();
    g.beginPath(); g.ellipse( R * 0.06, R * 0.45, 2.2, 1.6, -0.3, 0, 7); g.fill();

    // boca: varia — costurada fechada, ESCANCARADA num grito, ou rasgo largo
    const mtype = r();
    if (mtype < 0.38) {
      // fechada, pequena, torta, costurada de dentes finos
      const mw = R * (0.5 + r() * 0.15), my = R * 0.72;
      g.save();
      g.translate((r() - 0.5) * R * 0.1, my);
      g.rotate((r() - 0.5) * 0.25);
      g.fillStyle = "rgba(0,0,0,0.92)";
      g.beginPath();
      g.moveTo(-mw / 2, 0);
      g.quadraticCurveTo(0, R * 0.16, mw / 2, -R * 0.02);
      g.quadraticCurveTo(0, R * 0.05, -mw / 2, 0);
      g.closePath(); g.fill();
      const nT = 7 + (r() * 4 | 0);
      for (let i2 = 0; i2 < nT; i2++) {
        const tx2 = -mw * 0.42 + (i2 / (nT - 1)) * mw * 0.84;
        pen(tx2, -1 + (r() - 0.5) * 2, tx2 + (r() - 0.5) * 1.5, 3.5 + r() * 3,
            0.4 + r() * 0.35, 0.8);
      }
      for (let i2 = 0; i2 < 16; i2++) {
        const tx2 = -mw / 2 + r() * mw;
        dark(tx2, -3 + r() * 2, tx2 + (r() - 0.5) * 6, 4 + r() * 4, 0.25, 0.8);
      }
      g.restore();
    } else if (mtype < 0.72) {
      // escancarada: vazio negro vertical, grande demais, aro rabiscado como os olhos
      const mrx = R * (0.19 + r() * 0.07), mry = R * (0.30 + r() * 0.15);
      g.save();
      g.translate((r() - 0.5) * R * 0.12, R * (0.58 + r() * 0.06));
      g.rotate((r() - 0.5) * 0.25);
      g.save(); g.scale(1, mry / mrx);
      const mhalo = g.createRadialGradient(0, 0, mrx * 0.4, 0, 0, mrx * 1.5);
      mhalo.addColorStop(0, "rgba(0,0,0,1)");
      mhalo.addColorStop(0.75, "rgba(0,0,0,0.85)");
      mhalo.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = mhalo;
      g.beginPath(); g.arc(0, 0, mrx * 1.5, 0, 7); g.fill();
      g.fillStyle = "#000";
      g.beginPath(); g.arc(0, 0, mrx, 0, 7); g.fill();
      for (let k = 0; k < 10; k++) {
        const rad2 = mrx * (0.98 + r() * 0.25);
        g.strokeStyle = `rgba(230,230,238,${0.15 + r() * 0.45})`;
        g.lineWidth = 0.6 + r() * 0.9;
        g.beginPath();
        const aa0 = r() * 6.28, arc = 1 + r() * 3, steps = 12;
        for (let i2 = 0; i2 <= steps; i2++) {
          const a = aa0 + i2 / steps * arc;
          const rj = rad2 * (1 + (r() - 0.5) * 0.18);
          i2 ? g.lineTo(Math.cos(a) * rj, Math.sin(a) * rj)
             : g.moveTo(Math.cos(a) * rj, Math.sin(a) * rj);
        }
        g.stroke();
      }
      g.restore();
      // dentes finos apontando para dentro do buraco
      const nT2 = 7 + (r() * 5 | 0);
      for (let i2 = 0; i2 < nT2; i2++) {
        const a = r() * 6.283;
        const ex2 = Math.cos(a) * mrx * 0.95, ey2 = Math.sin(a) * mry * 0.95;
        const len = 3 + r() * 5;
        pen(ex2, ey2, ex2 - Math.cos(a) * len, ey2 - Math.sin(a) * len * 0.7,
            0.35 + r() * 0.35, 0.8);
      }
      g.restore();
    } else {
      // rasgo largo demais atravessando o rosto, cheio de dentes
      const mw2 = R * (0.85 + r() * 0.25), mhh = R * (0.10 + r() * 0.05);
      g.save();
      g.translate((r() - 0.5) * R * 0.08, R * (0.60 + r() * 0.08));
      g.rotate((r() - 0.5) * 0.18);
      g.fillStyle = "rgba(0,0,0,0.94)";
      g.beginPath();
      g.moveTo(-mw2 / 2, 0);
      g.quadraticCurveTo(0, -mhh * 1.2, mw2 / 2, (r() - 0.5) * 4);
      g.quadraticCurveTo(0, mhh * 3.2, -mw2 / 2, 0);
      g.closePath(); g.fill();
      const nT3 = 14 + (r() * 6 | 0);
      for (let i2 = 0; i2 < nT3; i2++) {
        const t = i2 / (nT3 - 1);
        const tx2 = -mw2 * 0.46 + t * mw2 * 0.92;
        const topY = -mhh * (0.6 + Math.sin(t * Math.PI) * 0.5);
        const botY = mhh * (0.7 + Math.sin(t * Math.PI) * 1.6);
        pen(tx2, topY, tx2 + (r() - 0.5) * 2, botY, 0.4 + r() * 0.35, 0.9 + r() * 0.5);
      }
      for (let k = 0; k < 12; k++) {
        const t = r();
        const tx2 = -mw2 / 2 + t * mw2;
        dark(tx2, -mhh - 2 + r() * 2, tx2 + (r() - 0.5) * 8, mhh * 2.5 + r() * 4, 0.3, 0.9);
      }
      g.restore();
    }

    g.restore();
  }

  // mão esquelética: placa óssea hachurada, fileira de nós, dedos com falanges
  // nF = quantidade de dedos (4 a 6 deixa a anatomia "errada" na medida)
  function hand(cx, cy, S, baseAng, curl, spread, nF) {
    nF = nF || 5;
    const mid = (nF - 1) / 2;
    // dorso da mão: forma irregular pequena (nunca bola preta)
    g.fillStyle = "rgba(4,4,6,0.92)";
    g.beginPath();
    for (let i = 0; i <= 10; i++) {
      const a = i / 10 * 6.283;
      const rr2 = S * (0.22 + (r() - 0.5) * 0.05);
      const x = cx + Math.cos(a) * rr2 * 1.15, y = cy + Math.sin(a) * rr2 * 0.8;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
    for (let i = 0; i < 26; i++) {                     // hachura do dorso
      const a = r() * 6.28, rad = Math.sqrt(r());
      const x = cx + Math.cos(a) * rad * S * 0.2;
      const y = cy + Math.sin(a) * rad * S * 0.15;
      pen(x, y, x + (r() - 0.5) * 7, y + (r() - 0.5) * 7, 0.15 + r() * 0.25, 0.7);
    }
    // fileira de nós na base dos dedos
    for (let f = 0; f < nF; f++) {
      const fa = baseAng + (f - mid) * spread;
      const kx = cx + Math.cos(fa) * S * 0.27, ky = cy + Math.sin(fa) * S * 0.22;
      g.strokeStyle = `rgba(232,232,240,${0.5 + r() * 0.3})`;
      g.lineWidth = 1.2;
      g.beginPath(); g.arc(kx, ky, S * 0.05, fa - 2.6, fa - 0.5); g.stroke();
    }
    // dedos: falanges GROSSAS com osso claro dos dois lados, ruga na junta, garra
    for (let f = 0; f < nF; f++) {
      const fa = baseAng + (f - mid) * spread + (r() - 0.5) * 0.08;
      const flen = S * (0.62 + 0.38 * Math.sin((f + 0.5) / nF * Math.PI))
                     * (0.9 + r() * 0.3);
      let x = cx + Math.cos(fa) * S * 0.27;
      let y = cy + Math.sin(fa) * S * 0.22;
      let ang = fa;
      const segLen = [flen * 0.42, flen * 0.33, flen * 0.27];
      for (let s2 = 0; s2 < 3; s2++) {
        ang += curl * (0.45 + s2 * 0.45) + (r() - 0.5) * 0.1;
        const nx = x + Math.cos(ang) * segLen[s2];
        const ny = y + Math.sin(ang) * segLen[s2];
        const th = S * (0.095 - s2 * 0.022);
        g.strokeStyle = "rgba(3,3,5,0.92)";
        g.lineWidth = th + 1.5;
        g.lineCap = "round";
        g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke();
        const px2 = -Math.sin(ang), py2 = Math.cos(ang);
        for (const off of [-th * 0.45, th * 0.45])
          pen(x + px2 * off, y + py2 * off, nx + px2 * off, ny + py2 * off,
              0.5 + r() * 0.3, 1.3);
        // ruga da junta atravessando o dedo
        pen(nx - px2 * th * 0.7, ny - py2 * th * 0.7,
            nx + px2 * th * 0.7, ny + py2 * th * 0.7, 0.55 + r() * 0.3, 1.1);
        x = nx; y = ny;
      }
      const ca = ang + curl * 1.2;
      const clen = S * (0.17 + r() * 0.08);
      g.strokeStyle = `rgba(240,240,246,${0.7 + r() * 0.25})`;
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(ang) * clen * 0.7, y + Math.sin(ang) * clen * 0.7,
                         x + Math.cos(ca) * clen, y + Math.sin(ca) * clen);
      g.stroke();
    }
  }

  // braço ossudo: núcleo escuro FINO + linhas de osso tremidas + dobras
  function arm(x0, y0, x1, y1, x2, y2, thick) {
    function bez(t) {
      return [(1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * x1 + t * t * x2,
              (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * y1 + t * t * y2];
    }
    g.strokeStyle = "rgba(3,3,5,0.92)";
    g.lineWidth = thick;
    g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, y0);
    g.quadraticCurveTo(x1, y1, x2, y2); g.stroke();
    for (let k = 0; k < 3; k++) {
      const off = (k - 1) * thick * 0.35;
      let p = bez(0);
      for (let t = 0.2; t <= 1.001; t += 0.2) {
        const q = bez(t);
        pen(p[0] + off + (r() - 0.5) * 2, p[1], q[0] + off + (r() - 0.5) * 2, q[1],
            0.3 + r() * 0.3, 1.0);
        p = q;
      }
    }
    for (let k = 0; k < 6; k++) {          // dobras transversais
      const p = bez(r());
      pen(p[0] - 3 - r() * 3, p[1] + (r() - 0.5) * 4,
          p[0] + 3 + r() * 3, p[1] + (r() - 0.5) * 4, 0.25 + r() * 0.2, 0.8);
    }
  }

  // garras avulsas (pés, pontas)
  function claws(x, y, dir, len, n2) {
    for (let f = 0; f < n2; f++) {
      const a = dir + (f - (n2 - 1) / 2) * 0.3 + (r() - 0.5) * 0.15;
      const l2 = len * (0.7 + r() * 0.6);
      g.strokeStyle = `rgba(238,238,245,${0.55 + r() * 0.3})`;
      g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a) * l2 * 0.6, y + Math.sin(a) * l2 * 0.6 + 2,
                         x + Math.cos(a) * l2, y + Math.sin(a) * l2 + 3);
      g.stroke();
    }
  }

  // tronco esquelético: espinha fina + costelas, no mesmo traço dos braços
  // (sem massa preenchida — o usuário prefere o corpo riscado e magro)
  function torso(cx, y0, y1, wTop, wBot, bend) {
    const mx2 = cx + bend, my2 = (y0 + y1) / 2;
    const ex2 = cx + bend * 0.6;
    function spine(t) {
      return [(1 - t) * (1 - t) * cx + 2 * (1 - t) * t * mx2 + t * t * ex2,
              (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my2 + t * t * y1];
    }
    // espinha: mesma construção do braço (núcleo fino + linhas de osso)
    arm(cx, y0, mx2, my2, ex2, y1, 5);
    // clavícula torta
    pen(cx - wTop * 0.45, y0 + 4 + (r() - 0.5) * 3,
        cx + wTop * 0.45, y0 + 2 + (r() - 0.5) * 3, 0.4 + r() * 0.2, 1.4);
    // costelas: pares de arcos finos saindo da espinha
    const nR = 5 + (r() * 2 | 0);
    for (let k = 0; k < nR; k++) {
      const t = 0.12 + k * (0.55 / nR);
      const [sx2, sy2] = spine(t);
      const w2 = (wTop + (wBot - wTop) * t) * (0.55 + r() * 0.15);
      for (const sd of [-1, 1]) {
        g.strokeStyle = `rgba(222,222,230,${0.25 + r() * 0.3})`;
        g.lineWidth = 1 + r() * 0.7;
        g.beginPath();
        g.moveTo(sx2, sy2);
        g.quadraticCurveTo(sx2 + sd * w2 * 0.7, sy2 + 2 + r() * 3,
                           sx2 + sd * w2, sy2 + w2 * 0.35 + r() * 4);
        g.stroke();
      }
    }
    // farrapos soltos pendurados nas costelas
    for (let k = 0; k < 14; k++) {
      const [sx2, sy2] = spine(r());
      const off = (r() - 0.5) * wTop * 0.9;
      pen(sx2 + off, sy2, sx2 + off + (r() - 0.5) * 6, sy2 + 8 + r() * 16,
          0.08 + r() * 0.18, 0.6);
    }
  }

  return { pen, dark, skull, hand, arm, claws, torso };
}
