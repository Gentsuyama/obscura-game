// corpo inteiro distorcido: tronco torto rabiscado, dois braços, pernas ossudas
function ghostBody(r) {
  const w = 220, h = 340;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  g.lineCap = "round";
  const T = penTools(g, r);
  const R = 40 + r() * 5;
  const bend = (r() - 0.5) * w * 0.26;            // torção lateral da coluna
  const hx = w * 0.5 + (r() - 0.5) * 10, hy = h * 0.155;

  // pernas atrás do tronco: finas, tortas, joelhos para fora
  const hipY = h * 0.60;
  const hipX = hx + bend * 0.9;
  const fL = { x: hipX - w * (0.06 + r() * 0.05), y: h * (0.94 + r() * 0.03) };
  const fR = { x: hipX + w * (0.05 + r() * 0.05), y: h * (0.95 + r() * 0.02) };
  T.arm(hipX - R * 0.35, hipY, hipX - w * (0.14 + r() * 0.04), h * 0.78, fL.x, fL.y, 5);
  T.claws(fL.x, fL.y, Math.PI * 0.5, 8, 3);
  T.arm(hipX + R * 0.35, hipY, hipX + w * (0.15 + r() * 0.04), h * 0.80, fR.x, fR.y, 5);
  T.claws(fR.x, fR.y, Math.PI * 0.5, 8, 3);

  // tronco torto (rabisco, sem bolhas)
  T.torso(hx, h * 0.235, h * 0.62, R * 1.5, R * 0.95, bend);

  // braços compridos com mãos variadas
  const hLx = hx - w * (0.27 + r() * 0.05), hLy = h * (0.52 + r() * 0.12);
  const hRx = hx + w * (0.28 + r() * 0.05), hRy = h * (0.48 + r() * 0.14);
  T.arm(hx - R * 0.75, h * 0.285, hx - w * 0.30, h * 0.40, hLx, hLy, 5);
  T.hand(hLx, hLy + 8, 34 + r() * 10,
         Math.PI * (0.5 + (r() - 0.5) * 0.25), 0.14 + r() * 0.3, 0.3, 4 + (r() * 3 | 0));
  T.arm(hx + R * 0.75, h * 0.285, hx + w * 0.33, h * 0.42, hRx, hRy, 5);
  T.hand(hRx, hRy + 8, 34 + r() * 10,
         Math.PI * (0.5 + (r() - 0.5) * 0.25), 0.14 + r() * 0.3, 0.3, 4 + (r() * 3 | 0));

  // cabeça por cima de tudo, caída/torta (cabelo curto: o corpo precisa aparecer)
  T.skull(hx, hy, R, (r() - 0.5) * 0.4, 0.55);

  cv._aspect = 0.65; cv._hscale = 1.12;
  return cv;
}

// pool de criaturas pré-geradas na abertura (uma a cada 40ms, sem travar
// o carregamento); a foto só sorteia do pool — custo zero na hora do clique
const GHOST_POOL = [];
const GHOST_POOL_N = 12;
(function warmGhostPool() {
  if (GHOST_POOL.length >= GHOST_POOL_N) return;
  GHOST_POOL.push(makeGhostSprite((GHOST_POOL.length + Math.random()) / GHOST_POOL_N));
  setTimeout(warmGhostPool, 40);
})();
function ghostSprite(seed) {
  if (GHOST_POOL.length) return GHOST_POOL[(seed * GHOST_POOL.length) | 0];
  return makeGhostSprite(seed);
}

let FILM_SPR = null, EXIT_SPR = null, GLOW_SPR = null;
let VHS_S = null, RS_S = null;   // buffers reutilizados (evita pausas de GC)

// clarão do flash estourando na criatura (modo realista)
function makeGlowSprite() {
  const s = 128;
  const cv = document.createElement("canvas");
  cv.width = s; cv.height = s;
  const g = cv.getContext("2d");
  const rad = g.createRadialGradient(s / 2, s / 2, 4, s / 2, s / 2, s / 2 - 2);
  rad.addColorStop(0, "rgba(255,250,235,0.60)");
  rad.addColorStop(0.6, "rgba(255,250,235,0.22)");
  rad.addColorStop(1, "rgba(255,250,235,0)");
  g.fillStyle = rad; g.fillRect(0, 0, s, s);
  return cv;
}

function makeFilmSprite() {
  const s = 120;
  const cv = document.createElement("canvas");
  cv.width = s; cv.height = s;
  const g = cv.getContext("2d");
  const c = s / 2;

  // brilho esverdeado suave
  const rad = g.createRadialGradient(c, c, 2, c, c, c * 0.9);
  rad.addColorStop(0, "rgba(180,230,180,0.30)");
  rad.addColorStop(1, "rgba(180,230,180,0)");
  g.fillStyle = rad; g.fillRect(0, 0, s, s);

  // cartucho 35mm em pé
  const bw = s * 0.32, bh = s * 0.46;
  const bx = c - bw / 2 - s * 0.08, by = c - bh * 0.35;
  g.fillStyle = "#23262b"; g.fillRect(bx, by, bw, bh);
  const shine = g.createLinearGradient(bx, 0, bx + bw, 0);   // corpo cilíndrico
  shine.addColorStop(0, "rgba(255,255,255,0)");
  shine.addColorStop(0.3, "rgba(255,255,255,0.22)");
  shine.addColorStop(0.6, "rgba(255,255,255,0)");
  g.fillStyle = shine; g.fillRect(bx, by, bw, bh);
  g.fillStyle = "#3a3f47"; g.fillRect(bx - 2, by - s * 0.05, bw + 4, s * 0.05);  // tampa
  g.fillStyle = "#cfd6cf"; g.fillRect(bx + 3, by + bh * 0.20, bw - 6, bh * 0.44); // rótulo
  g.fillStyle = "#a33630"; g.fillRect(bx + 3, by + bh * 0.56, bw - 6, 4);
  g.fillStyle = "#23262b";
  g.font = "bold 13px 'Courier New', monospace";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("35", bx + bw / 2, by + bh * 0.38);

  // língua de filme saindo do cartucho
  g.fillStyle = "#3a3320";
  g.fillRect(bx + bw, by + bh * 0.28, s * 0.30, bh * 0.36);
  g.fillStyle = "#0a0a0a";
  for (let i = 0; i < 4; i++) {
    g.fillRect(bx + bw + 4 + i * s * 0.065, by + bh * 0.32, 4, 4);
    g.fillRect(bx + bw + 4 + i * s * 0.065, by + bh * 0.54, 4, 4);
  }
  return cv;
}

function makeExitSprite() {
  const w = 160, h = 200;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  const cx = w / 2, cy = h * 0.52;

  // clarão externo
  const glow = g.createRadialGradient(cx, cy, 4, cx, cy, w * 0.60);
  glow.addColorStop(0, "rgba(190,205,255,0.5)");
  glow.addColorStop(1, "rgba(190,205,255,0)");
  g.fillStyle = glow; g.fillRect(0, 0, w, h);

  // vazio interno
  const voidG = g.createRadialGradient(cx, cy, 2, cx, cy, w * 0.29);
  voidG.addColorStop(0, "rgba(0,0,0,1)");
  voidG.addColorStop(0.8, "rgba(8,10,25,0.95)");
  voidG.addColorStop(1, "rgba(20,30,60,0.4)");
  g.fillStyle = voidG;
  g.beginPath(); g.ellipse(cx, cy, w * 0.28, h * 0.38, 0, 0, 7); g.fill();

  // anel do portal
  g.strokeStyle = "rgba(230,240,255,0.95)";
  g.lineWidth = 5;
  g.shadowColor = "rgba(150,180,255,0.9)";
  g.shadowBlur = 16;
  g.beginPath(); g.ellipse(cx, cy, w * 0.30, h * 0.40, 0, 0, 7); g.stroke();

  // espirais sendo sugadas para dentro
  g.strokeStyle = "rgba(150,175,240,0.6)";
  g.lineWidth = 2; g.shadowBlur = 8;
  for (let k = 0; k < 3; k++) {
    g.beginPath();
    let first = true;
    for (let a = 0; a < Math.PI * 1.6; a += 0.15) {
      const rr = (w * 0.26) * (1 - a / (Math.PI * 1.9));
      const px2 = cx + Math.cos(a + k * 2.1) * rr;
      const py2 = cy + Math.sin(a + k * 2.1) * rr * 1.35;
      if (first) { g.moveTo(px2, py2); first = false; } else g.lineTo(px2, py2);
    }
    g.stroke();
  }
  return cv;
}

function makeAnomalySprite(captured) {
  const s = 150;
  const cv = document.createElement("canvas");
  cv.width = s; cv.height = s;
  const g = cv.getContext("2d");
  const c = s / 2;
  const main = captured ? "rgba(130,130,130," : "rgba(255,72,58,";
  const glow = captured ? "rgba(120,120,120," : "rgba(255,40,30,";

  const rad = g.createRadialGradient(c, c, 2, c, c, c);
  rad.addColorStop(0, glow + "0.5)");
  rad.addColorStop(0.55, glow + "0.14)");
  rad.addColorStop(1, glow + "0)");
  g.fillStyle = rad;
  g.fillRect(0, 0, s, s);

  g.strokeStyle = main + "0.9)";
  g.shadowColor = glow + "0.9)";
  g.shadowBlur = 12;
  g.lineWidth = 3;

  // anel externo com marcas
  g.beginPath(); g.arc(c, c, s * 0.34, 0, 7); g.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    g.beginPath();
    g.moveTo(c + Math.cos(a) * s * 0.34, c + Math.sin(a) * s * 0.34);
    g.lineTo(c + Math.cos(a) * s * 0.42, c + Math.sin(a) * s * 0.42);
    g.stroke();
  }
  // triângulo invertido + olho central
  g.beginPath();
  g.moveTo(c, c + s * 0.24);
  g.lineTo(c - s * 0.21, c - s * 0.13);
  g.lineTo(c + s * 0.21, c - s * 0.13);
  g.closePath(); g.stroke();
  g.beginPath(); g.arc(c, c, s * 0.07, 0, 7); g.stroke();
  return cv;
}

// cena REALISTA: raycaster com superfícies contínuas e textura procedural,
// renderizada em baixa resolução e ampliada (vira a base do passe VHS)
function renderRealisticScene(c, px, py, FR, PW, PH, dirX, dirY, planeX, planeY, MAXD, W2) {
  const H2 = Math.round(PH / 2);
  if (!RS_S || RS_S.img.width !== W2 || RS_S.img.height !== H2) {
    RS_S = { img: new ImageData(W2, H2), tmp: document.createElement("canvas") };
    RS_S.tmp.width = W2; RS_S.tmp.height = H2;
  }
  const img = RS_S.img;
  const d = img.data;
  const zbuf = new Float32Array(W2);
  const posZ = 0.675 * H2;

  function h2(x, y) {
    let n = x * 374761393 + y * 668265263 + 1013904223;
    n = (n ^ (n >> 13)) * 1274126177;
    return ((n ^ (n >> 16)) >>> 0) / 4294967295;
  }
  function vn(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const fx = x - xi, fy = y - yi;
    const a = h2(xi, yi), b = h2(xi + 1, yi);
    const e = h2(xi, yi + 1), f = h2(xi + 1, yi + 1);
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * sx + (e - a) * sy + (a - b - e + f) * sx * sy;
  }
  function fbm(x, y) {
    return 0.62 * vn(x, y) + 0.27 * vn(x * 2.1 + 13.7, y * 2.1 + 7.3)
         + 0.11 * vn(x * 4.3 + 31.1, y * 4.3 + 17.9);
  }

  for (let col = 0; col < W2; col++) {
    const camX = 2 * col / W2 - 1;
    const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
    let mapX = px | 0, mapY = py | 0;
    const dX = Math.abs(1 / (rdx || 1e-9)), dY = Math.abs(1 / (rdy || 1e-9));
    let stepX, stepY, sideX, sideY;
    if (rdx < 0) { stepX = -1; sideX = (px - mapX) * dX; }
    else         { stepX =  1; sideX = (mapX + 1 - px) * dX; }
    if (rdy < 0) { stepY = -1; sideY = (py - mapY) * dY; }
    else         { stepY =  1; sideY = (mapY + 1 - py) * dY; }

    let side = 0, perp = MAXD, hit = false;
    for (let it = 0; it < 160; it++) {
      if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
      else               { sideY += dY; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= COLS || mapY >= ROWS) break;
      if (grid[mapY * COLS + mapX] === 1) {
        perp = side === 0 ? sideX - dX : sideY - dY;
        hit = true; break;
      }
      if (Math.min(sideX, sideY) > MAXD) break;
    }
    perp = Math.max(perp, 0.12);
    zbuf[col] = perp;

    const wallH = H2 * 1.35 / perp;
    const start = H2 / 2 - wallH / 2;
    const s0 = Math.max(0, Math.round(start));
    const s1 = Math.min(H2 - 1, Math.round(start + wallH));
    const centerFall = 1 - 0.42 * camX * camX;

    let wallX = side === 0 ? py + perp * rdy : px + perp * rdx;
    wallX -= Math.floor(wallX);

    for (let yy = 0; yy < H2; yy++) {
      let rr = 0, gg = 0, bb = 0;
      if (hit && yy >= s0 && yy <= s1) {
        // parede: reboco encardido
        const texY = (yy - start) / wallH;
        const t = fbm((mapX + wallX) * 5.1, texY * 5.1 + mapY * 2.7);
        let L = Math.max(0, 1 - perp / 28) * centerFall * (0.5 + 0.8 * t);
        if (side === 1) L *= 0.72;
        if (texY > 0.88) L *= 0.55;              // rodapé mais escuro
        rr = 208 * L; gg = 194 * L; bb = 166 * L;
      } else if (yy > H2 / 2) {
        // assoalho com manchas
        const rowDist = posZ / (yy - H2 / 2);
        const wx2 = px + rdx * rowDist, wy2 = py + rdy * rowDist;
        const t = fbm(wx2 * 1.6, wy2 * 1.6);
        const L = Math.max(0, 1 - rowDist / 24) * centerFall * (0.45 + 0.85 * t);
        rr = 138 * L; gg = 124 * L; bb = 104 * L;
      } else {
        // teto engolido pela escuridão
        const t = fbm(col * 0.06 + 99, yy * 0.06);
        const v = 6 + 12 * t * centerFall;
        rr = v; gg = v; bb = v * 0.94;
      }
      const i4 = (yy * W2 + col) * 4;
      d[i4] = rr; d[i4 + 1] = gg; d[i4 + 2] = bb; d[i4 + 3] = 255;
    }
  }

  RS_S.tmp.getContext("2d").putImageData(img, 0, 0);
  c.imageSmoothingEnabled = true;
  c.drawImage(RS_S.tmp, FR, FR, PW, PH);
  return zbuf;
}

// pós-processamento "fita VHS 1996" aplicado à área interna da foto
function vhsPass(cv, x, y, iw, ih) {
  const c = cv.getContext("2d");

  // baixa resolução analógica (down/upscale com borrão) — buffers reutilizados
  if (!VHS_S || VHS_S.out.width !== iw || VHS_S.out.height !== ih) {
    VHS_S = {
      tmp: document.createElement("canvas"),
      out: document.createElement("canvas"),
      ch:  document.createElement("canvas"),
    };
    VHS_S.tmp.width = (iw * 0.55) | 0; VHS_S.tmp.height = (ih * 0.5) | 0;
    VHS_S.out.width = iw; VHS_S.out.height = ih;
    VHS_S.ch.width = iw;  VHS_S.ch.height = ih;
  }
  const tmp = VHS_S.tmp, out = VHS_S.out;
  const tc = tmp.getContext("2d");
  tc.clearRect(0, 0, tmp.width, tmp.height);
  tc.drawImage(cv, x, y, iw, ih, 0, 0, tmp.width, tmp.height);

  const o = out.getContext("2d");
  o.globalCompositeOperation = "source-over";
  o.fillStyle = "#000"; o.fillRect(0, 0, iw, ih);

  // aberração cromática: canais R/G/B deslocados
  function channel(color, dx2, dy2) {
    const c2 = VHS_S.ch.getContext("2d");
    c2.globalCompositeOperation = "source-over";
    c2.clearRect(0, 0, iw, ih);
    c2.drawImage(tmp, 0, 0, iw, ih);
    c2.globalCompositeOperation = "multiply";
    c2.fillStyle = color; c2.fillRect(0, 0, iw, ih);
    o.globalCompositeOperation = "lighter";
    o.drawImage(VHS_S.ch, dx2, dy2);
  }
  channel("#ff0000", 1.8, 0);
  channel("#00ff00", 0, 0);
  channel("#0000ff", -1.8, 0.6);

  // tom amarelado lavado + pretos levantados
  o.globalCompositeOperation = "multiply";
  o.fillStyle = "rgba(238,224,168,0.30)"; o.fillRect(0, 0, iw, ih);
  o.globalCompositeOperation = "lighten";
  o.fillStyle = "rgb(24,26,18)"; o.fillRect(0, 0, iw, ih);
  o.globalCompositeOperation = "source-over";

  // scanlines
  o.fillStyle = "rgba(0,0,0,0.22)";
  for (let yy = 0; yy < ih; yy += 3) o.fillRect(0, yy, iw, 1);

  // bandas de tracking (fatias deslocadas)
  const nb = 1 + (Math.random() * 2 | 0);
  for (let i = 0; i < nb; i++) {
    const by = Math.random() * ih, bh2 = 2 + Math.random() * 7;
    const off = (Math.random() - 0.5) * 16;
    o.drawImage(out, 0, by, iw, bh2, off, by, iw, bh2);
  }

  // dropouts (riscos brancos de fita)
  for (let i = 0; i < 7; i++) if (Math.random() < 0.6) {
    o.fillStyle = `rgba(255,255,255,${0.08 + Math.random() * 0.22})`;
    o.fillRect(Math.random() * iw, Math.random() * ih, 20 + Math.random() * 90, 1);
  }
  // grão pesado
  for (let i = 0; i < 800; i++) {
    const b = (Math.random() * 255) | 0;
    o.fillStyle = `rgba(${b},${b},${b},0.06)`;
    o.fillRect(Math.random() * iw, Math.random() * ih, 2, 1);
  }

  // overlay de camcorder
  o.fillStyle = "rgba(255,64,52,0.95)";
  o.beginPath(); o.arc(24, 22, 5, 0, 7); o.fill();
  o.font = "bold 13px 'Courier New', monospace";
  o.textAlign = "left"; o.textBaseline = "middle";
  o.fillStyle = "rgba(235,235,235,0.92)";
  o.fillText("REC", 36, 22);
  o.textAlign = "right";
  const mm = String((Math.random() * 59) | 0).padStart(2, "0");
  const ss = String((Math.random() * 59) | 0).padStart(2, "0");
  o.fillText(`NOITE ${level}  03:${mm}:${ss} AM`, iw - 14, 22);

  c.drawImage(out, x, y);
}

// desenha o sprite coluna a coluna respeitando o z-buffer das paredes
function blitOccluded(c, spr, zbuf, ty, centerX, topY, wPx, hPx, alpha, W, CW, FR) {
  const destX = centerX - wPx / 2;
  const colStart = Math.max(0, Math.floor((destX - FR) / CW));
  const colEnd = Math.min(W - 1, Math.ceil((destX + wPx - FR) / CW));
  c.save();
  c.globalAlpha = Math.max(0, Math.min(1, alpha));
  for (let col = colStart; col <= colEnd; col++) {
    if (ty >= zbuf[col]) continue;
    const dx0 = FR + col * CW;
    const sx0 = (dx0 - destX) / wPx * spr.width;
    const sw = Math.max(1, CW / wPx * spr.width);
    c.drawImage(spr, sx0, 0, sw, spr.height, dx0, topY, CW, hPx);
  }
  c.restore();
}

function renderPhoto(px, py, dir, gotAnomaly) {
  const W = 96, H = 58, CW = 6, CH = 7;
  const FR = 14, BOT = 44;                       // moldura
  const cv = document.createElement("canvas");
  cv.width = W * CW + FR * 2; cv.height = H * CH + FR + BOT;
  const c = cv.getContext("2d");

  // moldura
  c.fillStyle = "#1a1a1a"; c.fillRect(0, 0, cv.width, cv.height);
  c.strokeStyle = "#3a3a3a"; c.strokeRect(2.5, 2.5, cv.width - 5, cv.height - 5);
  c.fillStyle = "#000"; c.fillRect(FR, FR, W * CW, H * CH);

  c.font = "bold 8px 'Courier New', monospace";
  c.textAlign = "center"; c.textBaseline = "middle";

  const FOV = 1.15;
  const dirX = Math.cos(dir), dirY = Math.sin(dir);
  const tanF = Math.tan(FOV / 2);
  const planeX = -dirY * tanF, planeY = dirX * tanF;

  const MAXD = 32;
  const Wc = 288, CWc = (W * CW) / 288;
  const zbuf = renderRealisticScene(c, px, py, FR, W * CW, H * CH,
                                    dirX, dirY, planeX, planeY, MAXD, Wc);


  // --- sprites (fantasmas e anomalias) com z-buffer ---
  const sprites = [];
  for (const g of ghosts) if (g.respawn <= 0)
    sprites.push({ x: g.x, y: g.y, kind: "ghost", gh: g });
  for (const a of anomalies)
    sprites.push({ x: a.x, y: a.y, kind: a.captured ? "anomOld" : "anom" });
  for (const f of filmPickups)
    sprites.push({ x: f.x, y: f.y, kind: "film" });
  if (exitP.active)
    sprites.push({ x: exitP.x, y: exitP.y, kind: "exit" });

  const invDet = 1 / (planeX * dirY - dirX * planeY);
  sprites.sort((a, b) =>
    Math.hypot(b.x - px, b.y - py) - Math.hypot(a.x - px, a.y - py));

  const areaH = H * CH;
  for (const s of sprites) {
    const dx = s.x - px, dy = s.y - py;
    const tx = invDet * (dirY * dx - dirX * dy);
    const ty = invDet * (-planeY * dx + planeX * dy);
    if (ty <= 0.4 || ty > MAXD) continue;
    const sxCol = (Wc / 2) * (1 + tx / ty);
    if (sxCol < -Wc * 0.3 || sxCol > Wc * 1.3) continue;
    const centerX = FR + sxCol * CWc;
    const bright = Math.max(0, 1 - ty / 24);
    if (bright <= 0.03) continue;

    const wallHpx = (H * 1.35 / ty) * CH;                 // altura de 1 célula na tela
    const floorPx = FR + (areaH + wallHpx) / 2;           // linha do chão nessa distância

    if (s.kind === "ghost") {
      // sprite do pool, fixado por fantasma: mesma criatura = mesma cara
      const spr = s.gh.sprCv || (s.gh.sprCv = ghostSprite(s.gh.artSeed));
      const hs = spr._hscale || 1;
      const hPx = Math.min(areaH * 1.3, (H * 1.7 / ty) * CH) * hs;
      const wPx = hPx * (spr._aspect || 0.72);
      const topY = floorPx - hPx * 0.97;          // pés/garras no chão
      // halo sutil do flash (o rosto pálido já reflete a luz)
      const glow = GLOW_SPR || (GLOW_SPR = makeGlowSprite());
      blitOccluded(c, glow, zbuf, ty, centerX, topY - hPx * 0.04,
                   wPx * 1.25, hPx * 1.05, 0.16 + bright * 0.2, Wc, CWc, FR);
      blitOccluded(c, spr, zbuf, ty, centerX, topY, wPx, hPx,
                   Math.min(1, 0.35 + bright * 1.1), Wc, CWc, FR);
    } else if (s.kind === "film") {
      const spr = FILM_SPR || (FILM_SPR = makeFilmSprite());
      const hPx = Math.min(areaH * 0.7, wallHpx * 0.6);
      blitOccluded(c, spr, zbuf, ty, centerX, floorPx - hPx, hPx, hPx, 0.35 + bright, Wc, CWc, FR);
    } else if (s.kind === "exit") {
      const spr = EXIT_SPR || (EXIT_SPR = makeExitSprite());
      const hPx = Math.min(areaH * 1.15, wallHpx * 1.55);
      const wPx = hPx * 0.8;
      blitOccluded(c, spr, zbuf, ty, centerX, floorPx - hPx, wPx, hPx, 0.4 + bright, Wc, CWc, FR);
    } else {
      const spr = makeAnomalySprite(s.kind === "anomOld");
      const hPx = Math.min(areaH * 0.9, (H * 0.9 / ty) * CH);
      const topY = FR + areaH * 0.5 + (H * 0.25 / ty) * CH - hPx / 2;
      blitOccluded(c, spr, zbuf, ty, centerX, topY, hPx, hPx, 0.3 + bright, Wc, CWc, FR);
    }
  }

  // --- grão e vinheta ---
  for (let i = 0; i < 420; i++) {
    const gx = FR + Math.random() * W * CW, gy = FR + Math.random() * H * CH;
    c.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
    c.fillRect(gx, gy, 1.5, 1.5);
  }
  const vg = c.createRadialGradient(cv.width / 2, (FR + H * CH) / 2, H * CH * 0.35,
                                    cv.width / 2, (FR + H * CH) / 2, H * CH * 0.85);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.55)");
  c.fillStyle = vg; c.fillRect(FR, FR, W * CW, H * CH);

  // passe VHS 1996 (só a área da imagem; moldura e legenda intactas)
  vhsPass(cv, FR, FR, W * CW, H * CH);

  // --- legenda na moldura ---
  c.textAlign = "left";
  c.font = "bold 12px 'Courier New', monospace";
  c.fillStyle = "#888";
  c.fillText(`FOTO ${photoCount}  ·  NOITE ${level}`, FR, cv.height - 18);
  if (gotAnomaly) {
    c.fillStyle = "#c04040";
    c.textAlign = "right";
    c.fillText("ANOMALIA REGISTRADA", cv.width - FR, cv.height - 18);
  }
  return cv;
}

// ==================================================================
// UPDATE
// ==================================================================
function collides(x, y) {
  const r = PLAYER_RADIUS;
  const minX = Math.floor(x - r), maxX = Math.floor(x + r);
  const minY = Math.floor(y - r), maxY = Math.floor(y + r);
  for (let cy = minY; cy <= maxY; cy++)
    for (let cx = minX; cx <= maxX; cx++)
      if (isWall(cx, cy)) {
        const nx = Math.max(cx, Math.min(x, cx + 1));
        const ny = Math.max(cy, Math.min(y, cy + 1));
        if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return true;
      }
  return false;
}

function update(dt) {
  // --- jogador ---
  let vx = 0, vy = 0;
  if (keys.has("KeyW") || keys.has("ArrowUp"))    vy -= 1;
  if (keys.has("KeyS") || keys.has("ArrowDown"))  vy += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft"))  vx -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) vx += 1;
  if (Math.hypot(touchUI.jx, touchUI.jy) > 0.2) { vx += touchUI.jx; vy += touchUI.jy; }
  if (vx || vy) {
    const len = Math.hypot(vx, vy);
    vx = vx / len * PLAYER_SPEED * dt;
    vy = vy / len * PLAYER_SPEED * dt;
    if (!collides(player.x + vx, player.y)) player.x += vx;
    if (!collides(player.x, player.y + vy)) player.y += vy;
  }

  // --- timers ---
  if (flashCd > 0) flashCd -= dt;
  if (flashT > 0) flashT = Math.max(0, flashT - dt / FLASH.duration);
  if (attractT > 0) attractT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3);
  if (flickDip > 0) flickDip -= dt;
  if (announceT > 0) announceT -= dt;
  if (dmgSfxT > 0) dmgSfxT -= dt;

  // --- eventos de tensão ---
  eventT -= dt;
  if (eventT <= 0) {
    eventT = 16 + rng() * 20;
    if (rng() < 0.6) { flickDip = 0.55; sfxWhisper(); }
    else sfxWhisper();
  }

  // --- fantasmas ---
  let nearest = 999;
  const gSpeed = 3.0 + level * 0.4;    // fantasmas aceleram por noite
  for (const g of ghosts) {
    if (g.respawn > 0) {
      g.respawn -= dt;
      if (g.respawn <= 0) { const ng = spawnGhost(); Object.assign(g, ng); }
      continue;
    }
    const d = Math.hypot(player.x - g.x, player.y - g.y);
    nearest = Math.min(nearest, d);

    g.chase = d < 18 || attractT > 0;
    let tx, ty;
    if (g.chase) { tx = player.x; ty = player.y; }
    else {
      if (Math.hypot(g.wx - g.x, g.wy - g.y) < 1.5) {
        // metade dos destinos é perto do jogador: eles rondam a presa
        if (rng() < 0.5) {
          g.wx = player.x + (rng() - 0.5) * 22;
          g.wy = player.y + (rng() - 0.5) * 22;
        } else {
          const r = rooms[rng() * rooms.length | 0];
          const p = randInRoom(r); g.wx = p.x; g.wy = p.y;
        }
      }
      tx = g.wx; ty = g.wy;
    }
    const dd = Math.hypot(tx - g.x, ty - g.y) || 1;
    const sp = g.chase ? gSpeed : gSpeed * 0.55;
    g.bob += dt * 2.2;
    g.x += (tx - g.x) / dd * sp * dt + Math.cos(g.bob) * 0.6 * dt;
    g.y += (ty - g.y) / dd * sp * dt + Math.sin(g.bob * 1.3) * 0.6 * dt;
    if (!g.chase) {                       // atração constante, mesmo vagando
      g.x += (player.x - g.x) / d * gSpeed * 0.30 * dt;
      g.y += (player.y - g.y) / d * gSpeed * 0.30 * dt;
    }

    // toque do fantasma
    if (d < 1.15) {
      sanity -= (30 + level * 6) * dt;   // toque drena mais rápido a cada noite
      shake = 1;
      if (dmgSfxT <= 0) { sfxDamage(); dmgSfxT = 0.5; }
    }
  }

  // regeneração lenta longe deles
  if (nearest > 10 && sanity < 100) sanity = Math.min(100, sanity + 3.5 * dt);

  if (sanity <= 0) { state = "dead"; sfxDeath(); return; }

  // --- batimento cardíaco ---
  hbT -= dt;
  if (nearest < 20 && hbT <= 0) {
    hbT = 0.32 + (nearest / 20) * 1.1;
    sfxHeart(0.22 * (1 - nearest / 22));
  }

  // --- pickups de filme ---
  for (let i = filmPickups.length - 1; i >= 0; i--) {
    const f = filmPickups[i];
    if (Math.hypot(f.x - player.x, f.y - player.y) < 1.1) {
      film = Math.min(FILM_MAX, film + FILM_REFILL);
      filmPickups.splice(i, 1);
      sfxPickup();
    }
  }

  // --- saída ---
  if (exitP.active && Math.hypot(exitP.x - player.x, exitP.y - player.y) < 1.4) {
    state = "transition"; transT = 2.4;
    sfxSting();
  }

  // --- partículas ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
  }

  // --- câmera: no celular dá zoom e segue o jogador; no PC fica parada ---
  const zTarget = touchUI.seen ? 2.0 : 1;
  camZoom += (zTarget - camZoom) * Math.min(1, dt * 4);
  const hw = canvas.width / (2 * camZoom), hh = canvas.height / (2 * camZoom);
  const cx2 = Math.max(hw, Math.min(COLS * CELL - hw, player.x * CELL));
  const cy2 = Math.max(hh, Math.min(ROWS * CELL - hh, player.y * CELL));
  cam.x += (cx2 - cam.x) * Math.min(1, dt * 6);
  cam.y += (cy2 - cam.y) * Math.min(1, dt * 6);
}

// ==================================================================
// RENDER
// ==================================================================
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (state === "intro") { drawIntro(); return; }

  const shx = shake > 0 ? (Math.random() - 0.5) * 7 * shake : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 7 * shake : 0;
  ctx.setTransform(camZoom, 0, 0, camZoom,
                   canvas.width / 2 - cam.x * camZoom + shx,
                   canvas.height / 2 - cam.y * camZoom + shy);

  const dir = aimAngle();
  const tick = Math.floor(time * 12);

  // --- luz ---
  light.fill(0);
  let flick = 0.9 + 0.1 * hash(7, 13, tick);
  if (flickDip > 0) flick *= 0.3 + 0.35 * hash(3, 5, tick);
  // no celular o cone abre ~20% (tela menor pede campo de visão maior)
  const lHalf = LANTERNA.halfAngle * (touchUI.seen ? 1.2 : 1);
  const lRays = touchUI.seen ? (LANTERNA.rays * 1.2) | 0 : LANTERNA.rays;
  castLight(player.x, player.y, dir,
            lHalf, LANTERNA.range, LANTERNA.power * flick, lRays);
  if (flashT > 0) {
    const p = FLASH.power * flashT * flashT;
    castLight(player.x, player.y, flashDir, FLASH.halfAngle, FLASH.range, p, FLASH.rays);
  }
  addGlow(player.x, player.y, 3.5, 0.22);
  if (exitP.active) addGlow(exitP.x, exitP.y, 4, 0.3 + 0.1 * Math.sin(time * 2));

  // --- células ASCII ---
  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let cy = 0; cy < ROWS; cy++) {
    for (let cx = 0; cx < COLS; cx++) {
      const idx = cy * COLS + cx;
      let v = light[idx];
      if (v <= 0.02) continue;
      const n = hash(cx, cy, tick);
      v = v * (0.82 + 0.36 * n);
      const clamped = Math.min(v, 1);
      const ci = Math.min(RAMP.length - 1, (clamped * RAMP.length) | 0);
      if (ci === 0) continue;
      const isW = grid[idx] === 1;
      const b = (60 + 195 * clamped) | 0;
      ctx.fillStyle = isW
        ? `rgb(${b},${(b * 0.88) | 0},${(b * 0.66) | 0})`
        : `rgb(${b},${b},${b})`;
      ctx.fillText(isW ? "#" : RAMP[ci], cx * CELL + CELL / 2, cy * CELL + CELL / 2 + 1);
    }
  }

  // --- itens ---
  for (const a of anomalies) {
    const L = Math.min(1, lightAt(a.x, a.y) * 1.8);
    if (L <= 0.03) continue;
    ctx.font = "bold 15px 'Courier New', monospace";
    if (a.captured) ctx.fillStyle = `rgba(110,110,110,${L * 0.5})`;
    else ctx.fillStyle = `rgba(230,70,60,${L})`;
    ctx.fillText("§", a.x * CELL, a.y * CELL + 1);
  }
  ctx.font = "bold 12px 'Courier New', monospace";
  for (const f of filmPickups) {
    const L = Math.min(1, lightAt(f.x, f.y) * 1.8);
    if (L <= 0.03) continue;
    ctx.fillStyle = `rgba(180,220,180,${L})`;
    ctx.fillText("¤", f.x * CELL, f.y * CELL);
  }
  if (exitP.active) {
    const L = Math.min(1, lightAt(exitP.x, exitP.y) * 2);
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.fillStyle = `rgba(240,240,255,${0.4 + 0.6 * L})`;
    ctx.fillText("▼", exitP.x * CELL, exitP.y * CELL);
  }

  // --- fantasmas ---
  for (const g of ghosts) {
    if (g.respawn > 0) continue;
    const L = Math.min(1, lightAt(g.x, g.y) * 1.9);
    if (L <= 0.04) continue;
    const gy = g.y * CELL + Math.sin(g.bob) * 2.5;
    ctx.font = "bold 20px 'Courier New', monospace";
    const b = (90 + 165 * L) | 0;
    ctx.fillStyle = `rgba(${(b * 0.82) | 0},${(b * 0.92) | 0},${b},${0.35 + 0.65 * L})`;
    ctx.fillText("Ψ", g.x * CELL, gy);
    if (L > 0.4) {
      ctx.fillStyle = `rgba(255,60,60,${L})`;
      ctx.fillRect(g.x * CELL - 4, gy - 4, 2, 2);
      ctx.fillRect(g.x * CELL + 2, gy - 4, 2, 2);
    }
  }

  // --- partículas ---
  ctx.font = "bold 11px 'Courier New', monospace";
  for (const p of particles) {
    ctx.fillStyle = `rgba(190,210,255,${p.life})`;
    ctx.fillText(p.ch, p.x * CELL, p.y * CELL);
  }

  // --- jogador ---
  const px = player.x * CELL, py = player.y * CELL;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(dir + Math.PI / 2);
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(0, -7); ctx.lineTo(5.5, 6); ctx.lineTo(-5.5, 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.setTransform(1, 0, 0, 1, 0, 0);   // overlays abaixo são em espaço de tela

  // --- clarão do flash ---
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,255,${(flashT * flashT * 0.18).toFixed(3)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // --- estática (sanidade baixa) ---
  if (sanity < 70) {
    const inten = (70 - sanity) / 70;
    const n = (inten * 350) | 0;
    for (let i = 0; i < n; i++) {
      const b = (Math.random() * 160) | 0;
      ctx.fillStyle = `rgba(${b},${b},${b},0.35)`;
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
    }
  }

  // --- mira (só faz sentido com mouse) ---
  if (state === "play" && aimSource === "mouse") {
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 5, mouse.y); ctx.lineTo(mouse.x + 5, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 5); ctx.lineTo(mouse.x, mouse.y + 5);
    ctx.stroke();
  }

  drawHUD();

  if (state === "album") drawAlbum();
  if (state === "dead") drawDead();
  if (state === "transition") drawTransition();
}

// ==================================================================
// HUD e telas
// ==================================================================
function drawHUD() {
  const M = touchUI.seen;              // layout ampliado para celular
  ctx.font = M ? "bold 19px 'Courier New', monospace" : "bold 12px 'Courier New', monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";

  // topo
  ctx.fillStyle = "rgba(190,190,190,0.8)";
  const cap = anomalies.filter(a => a.captured).length;
  const y1 = M ? 30 : 18;
  ctx.fillText(`NOITE ${level}`, 12, y1);
  ctx.fillText(`ANOMALIAS ${cap}/${anomalies.length}`, M ? 150 : 110, y1);
  ctx.fillStyle = film > 0 ? "rgba(190,190,190,0.8)" : "rgba(230,80,70,0.9)";
  ctx.fillText(`FILME ${"▮".repeat(film)}${"▯".repeat(Math.max(0, FILM_MAX - film))}`,
               M ? 440 : 290, y1);
  if (exitP.active) {
    ctx.fillStyle = `rgba(240,240,255,${0.5 + 0.5 * Math.sin(time * 3)})`;
    ctx.fillText("A PASSAGEM SE ABRIU — encontre ▼", M ? 12 : 560, M ? 96 : 18);
  }

  // aviso grande ao liberar a porta
  if (announceT > 0 && state === "play") {
    const a = Math.min(1, announceT / 1.2);
    ctx.textAlign = "center";
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillStyle = `rgba(235,240,255,${(0.75 + 0.25 * Math.sin(time * 6)) * a})`;
    ctx.fillText(announceText, canvas.width / 2, 90);
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.fillStyle = `rgba(180,185,205,${0.8 * a})`;
    ctx.fillText("encontre ▼ para descer ao próximo andar", canvas.width / 2, 122);
    ctx.textAlign = "left";
  }

  // sanidade (maior no celular, no topo, longe dos direcionais)
  const sc = sanity > 40 ? "rgba(200,200,200,0.7)" : "rgba(230,70,60,0.85)";
  if (M) {
    ctx.fillStyle = "rgba(150,150,150,0.75)";
    ctx.fillText("SANIDADE", 12, 64);
    ctx.strokeStyle = "rgba(150,150,150,0.5)";
    ctx.strokeRect(132, 53, 240, 22);
    ctx.fillStyle = sc;
    ctx.fillRect(134, 55, 236 * Math.max(0, sanity) / 100, 18);
  } else {
    ctx.fillStyle = "rgba(120,120,120,0.5)";
    ctx.fillText("SANIDADE", 12, canvas.height - 46);
    ctx.strokeStyle = "rgba(150,150,150,0.4)";
    ctx.strokeRect(90, canvas.height - 52, 140, 11);
    ctx.fillStyle = sc;
    ctx.fillRect(91, canvas.height - 51, 138 * Math.max(0, sanity) / 100, 9);

    ctx.fillStyle = "rgba(160,160,160,0.55)";
    ctx.fillText("WASD mover · mouse lanterna · botão direito FOTO · F álbum",
                 12, canvas.height - 14);
  }

  // controles de toque (celular)
  if (touchUI.seen && state === "play") {
    // direcional de MOVIMENTO fixo (espelho do direcional da lanterna)
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.arc(MOVE_STICK.x, MOVE_STICK.y, MOVE_STICK.r, 0, 7); ctx.stroke();
    ctx.fillStyle = touchUI.joyId !== null ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.arc(MOVE_STICK.x + touchUI.jkx, MOVE_STICK.y + touchUI.jky, MOVE_STICK.knob, 0, 7);
    ctx.fill();
    // direcional FIXO da lanterna (knob preso no círculo, volta ao centro)
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.arc(AIM_STICK.x, AIM_STICK.y, AIM_STICK.r, 0, 7); ctx.stroke();
    const ad = aimAngle();      // marcador da direção atual da lanterna
    ctx.strokeStyle = "rgba(255,255,220,0.45)";
    ctx.beginPath();
    ctx.moveTo(AIM_STICK.x + Math.cos(ad) * (AIM_STICK.r - 8),
               AIM_STICK.y + Math.sin(ad) * (AIM_STICK.r - 8));
    ctx.lineTo(AIM_STICK.x + Math.cos(ad) * (AIM_STICK.r + 8),
               AIM_STICK.y + Math.sin(ad) * (AIM_STICK.r + 8));
    ctx.stroke();
    ctx.fillStyle = touchUI.aimId !== null ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.arc(AIM_STICK.x + touchUI.akx, AIM_STICK.y + touchUI.aky, AIM_STICK.knob, 0, 7);
    ctx.fill();

    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath(); ctx.arc(BTN_PHOTO.x, BTN_PHOTO.y, BTN_PHOTO.r, 0, 7); ctx.stroke();
    ctx.fillStyle = flashCd <= 0 && film > 0 ? "rgba(255,255,255,0.8)" : "rgba(255,120,120,0.65)";
    ctx.font = "bold 21px 'Courier New', monospace";
    ctx.fillText("FOTO", BTN_PHOTO.x, BTN_PHOTO.y + 1);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.arc(BTN_ALBUM.x, BTN_ALBUM.y, BTN_ALBUM.r, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.fillText("ÁLBUM", BTN_ALBUM.x, BTN_ALBUM.y + 1);

    // botão tela cheia: ícone de cantos (sem depender de fonte)
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.arc(BTN_FS.x, BTN_FS.y, BTN_FS.r, 0, 7); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.65)";
    ctx.lineWidth = 2;
    const fsIn = !!document.fullscreenElement;
    const cs = 15, cl = 7, dirIco = fsIn ? -1 : 1;   // cantos p/ fora = entrar, p/ dentro = sair
    for (const [sx2, sy2] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const bx2 = BTN_FS.x + sx2 * cs, by2 = BTN_FS.y + sy2 * cs;
      ctx.beginPath();
      ctx.moveTo(bx2 - sx2 * cl * dirIco, by2);
      ctx.lineTo(bx2, by2);
      ctx.lineTo(bx2, by2 - sy2 * cl * dirIco);
      ctx.stroke();
    }
    ctx.textAlign = "left";
  }
  ctx.fillStyle = flashCd <= 0 && film > 0 ? "rgba(120,255,120,0.7)" : "rgba(255,120,120,0.7)";
  ctx.fillText(film <= 0 ? "CAMERA [ SEM FILME ]" :
               flashCd <= 0 ? "CAMERA [ PRONTA ]" : "CAMERA [ RECARREGANDO ]",
               M ? 400 : 12, M ? 64 : canvas.height - 30);
}

function drawIntro() {
  const M = touchUI.seen;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 52px 'Courier New', monospace";
  const g = 200 + 40 * Math.sin(time * 2);
  ctx.fillStyle = `rgb(${g | 0},${g | 0},${g | 0})`;
  ctx.fillText("O B S C U R A", canvas.width / 2, M ? 92 : 150);

  const lines = M ? [
    "Você é um perito em fenômenos, enviado",
    "para documentar a Casa Vazia.",
    "",
    "Fotografe as 3 ANOMALIAS ( § ) de cada noite",
    "para abrir a PASSAGEM ( ▼ ) ao próximo andar.",
    "O filme é curto: procure refis ( ¤ ).",
    "O flash desfaz os moradores... mas os atrai.",
    "",
    "Direcional esquerdo: ANDAR · direito: LANTERNA",
    "FOTO fotografa · ÁLBUM revê suas fotos",
    "Botão de cantos, à direita: AMPLIAR A TELA",
  ] : [
    "Você é um perito em fenômenos, enviado para documentar a Casa Vazia.",
    "",
    "A cada noite, FOTOGRAFE as 3 ANOMALIAS ( § ) para romper o selo",
    "e revelar a PASSAGEM ( ▼ ) para o andar seguinte.",
    "",
    "O filme é curto — procure refis ( ¤ ) pelos quartos.",
    "Os moradores ( Ψ ) não gostam de visitas. O flash os desfaz...",
    "mas a luz também os atrai. Não deixe que toquem você.",
    "",
    "WASD / setas: mover      mouse: lanterna",
    "botão direito: fotografar      F: álbum de fotos",
  ];
  ctx.font = M ? "bold 21px 'Courier New', monospace" : "bold 14px 'Courier New', monospace";
  ctx.fillStyle = "rgba(185,185,185,0.9)";
  const y0 = M ? 162 : 240, lh = M ? 33 : 26;
  lines.forEach((l, i) => ctx.fillText(l, canvas.width / 2, y0 + i * lh));

  // botão INICIAR
  const hov = mouse.x >= BTN_START.x && mouse.x <= BTN_START.x + BTN_START.w &&
              mouse.y >= BTN_START.y && mouse.y <= BTN_START.y + BTN_START.h;
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.fillRect(BTN_START.x, BTN_START.y, BTN_START.w, BTN_START.h);
  ctx.lineWidth = hov ? 3 : 2;
  ctx.strokeStyle = `rgba(255,255,255,${hov ? 0.95 : 0.5 + 0.25 * Math.sin(time * 3)})`;
  ctx.strokeRect(BTN_START.x, BTN_START.y, BTN_START.w, BTN_START.h);
  ctx.font = "bold 27px 'Courier New', monospace";
  ctx.fillStyle = "rgba(240,240,240,0.95)";
  ctx.fillText("INICIAR", canvas.width / 2, BTN_START.y + BTN_START.h / 2 + 1);

  // cursor visível na intro (só mouse)
  if (!M) {
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mouse.x - 5, mouse.y); ctx.lineTo(mouse.x + 5, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 5); ctx.lineTo(mouse.x, mouse.y + 5);
    ctx.stroke();
  }
}

function drawAlbum() {
  ctx.fillStyle = "rgba(0,0,0,0.86)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.fillStyle = "rgba(200,200,200,0.9)";
  ctx.fillText("ÁLBUM DE FOTOS", canvas.width / 2, 36);

  if (album.length === 0) {
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.fillStyle = "rgba(150,150,150,0.7)";
    ctx.fillText("nenhuma foto revelada ainda", canvas.width / 2, canvas.height / 2);
  } else {
    const ph = album[albumIdx];
    const maxH = 520;
    const sc = Math.min(maxH / ph.cv.height, 900 / ph.cv.width);
    const w = ph.cv.width * sc, h = ph.cv.height * sc;
    ctx.drawImage(ph.cv, canvas.width / 2 - w / 2, 70, w, h);
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.fillStyle = "rgba(170,170,170,0.8)";
    ctx.fillText(`${albumIdx + 1} / ${album.length}`, canvas.width / 2, canvas.height - 56);
  }
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.fillStyle = "rgba(140,140,140,0.7)";
  ctx.fillText("← → navegar   ·   F fechar", canvas.width / 2, canvas.height - 28);
}

function drawDead() {
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 34px 'Courier New', monospace";
  ctx.fillStyle = "rgba(200,50,45,0.9)";
  ctx.fillText("OS MORADORES TE LEVARAM", canvas.width / 2, canvas.height / 2 - 30);
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = "rgba(180,180,180,0.8)";
  ctx.fillText(`você resistiu até a noite ${level}`, canvas.width / 2, canvas.height / 2 + 16);
  ctx.fillStyle = "rgba(170,170,170,0.85)";
  ctx.fillText("F — rever as fotos que você revelou", canvas.width / 2, canvas.height / 2 + 58);
  ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(time * 3)})`;
  ctx.fillText("ENTER — tentar novamente (as fotos se perdem)", canvas.width / 2, canvas.height / 2 + 86);

  if (touchUI.seen) {   // botão de toque para rever as fotos
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(canvas.width / 2 - 130, canvas.height / 2 + 92, 260, 56);
    ctx.fillStyle = "rgba(220,220,220,0.85)";
    ctx.fillText("VER FOTOS", canvas.width / 2, canvas.height / 2 + 114);
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.fillStyle = "rgba(150,150,150,0.7)";
    ctx.fillText("(toque fora do botão para recomeçar)", canvas.width / 2, canvas.height / 2 + 134);
  }
}

function drawTransition() {
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 30px 'Courier New', monospace";
  ctx.fillStyle = "rgba(220,220,220,0.9)";
  ctx.fillText(`NOITE ${level} DOCUMENTADA`, canvas.width / 2, canvas.height / 2 - 16);
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = "rgba(160,160,160,0.8)";
  ctx.fillText("descendo para o próximo andar...", canvas.width / 2, canvas.height / 2 + 26);
}

// ==================================================================
// LOOP
// ==================================================================
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  time += dt;

  if (state === "play") update(dt);
  else if (state === "transition") {
    transT -= dt;
    if (transT <= 0) {
      level++;
      film = Math.min(FILM_MAX, film + 2);
      genLevel();
      state = "play";
    }
  }

  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
